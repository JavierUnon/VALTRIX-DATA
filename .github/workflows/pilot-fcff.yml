
name: VALTRIX FCFF Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fcff-historico
    paths:
      - tools/fcff_coverage.py
      - tools/audit_xbrl_tags.py
      - tools/pilot_xbrl_recovery.py
      - tools/validate_xbrl_recovery.py
      - .github/workflows/pilot-fcff.yml

permissions:
  contents: read

jobs:
  fcff-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile \
            tools/build_data.py \
            tools/build_dcf_inputs.py \
            tools/build_app_data.py \
            tools/fcff_coverage.py \
            tools/audit_xbrl_tags.py \
            tools/pilot_xbrl_recovery.py \
            tools/validate_xbrl_recovery.py

      - name: Analyze FCFF data coverage
        run: python tools/fcff_coverage.py

      - name: Upload FCFF coverage report
        uses: actions/upload-artifact@v4
        with:
          name: valtrix-fcff-coverage
          path: data/fcff_coverage_report.json
          if-no-files-found: error
          retention-days: 30

      - name: Audit additional SEC XBRL tags
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -u tools/audit_xbrl_tags.py

      - name: Upload XBRL tag audit report
        uses: actions/upload-artifact@v4
        with:
          name: valtrix-xbrl-tag-audit
          path: data/xbrl_tag_audit_report.json
          if-no-files-found: error
          retention-days: 30

      - name: Pilot XBRL recovery for three companies
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -u tools/pilot_xbrl_recovery.py

      - name: Upload XBRL recovery pilot report
        uses: actions/upload-artifact@v4
        with:
          name: valtrix-xbrl-recovery-pilot
          path: data/pilot_xbrl_recovery_report.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate recovered XBRL observations
        run: python -u tools/validate_xbrl_recovery.py

      - name: Upload XBRL validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valtrix-xbrl-validation
          path: data/xbrl_recovery_validation_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm safe pilot
        run: |
          echo "FCFF coverage audit completed."
          echo "SEC XBRL tag audit completed."
          echo "Three-company recovery pilot completed."
          echo "XBRL technical validation completed."
          echo "Accounting review is still required."
          echo "No FCFF valuations were generated."
          echo "No production data was changed."
          echo "Automatic DCF remains disabled."

