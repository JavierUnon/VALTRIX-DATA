
name: Build Valtrix app data

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update SEC sample data
      - Update stock prices
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Valtrix data
        run: python tools/build_app_data.py

      - name: Save app data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/app/
          git diff --cached --quiet || git commit -m "Update Valtrix app data"
          git push
