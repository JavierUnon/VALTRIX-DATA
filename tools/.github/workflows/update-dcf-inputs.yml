
name: Update DCF inputs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calculate preliminary working capital
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python tools/build_dcf_inputs.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dcf_inputs/ data/dcf_inputs_report.json
          git diff --cached --quiet || git commit -m "Update preliminary DCF inputs"
          git push
